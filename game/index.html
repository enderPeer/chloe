<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>CHLOE — The Backstage Between</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230a0a0c'/%3E%3Ctext x='8' y='12.5' font-size='12' font-family='Impact,sans-serif' fill='%23e5173f' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="app">
  <div id="screen-title" class="screen"></div>
  <div id="screen-scene" class="screen"></div>
  <div id="screen-room3d" class="screen"></div>
  <div id="screen-battle3d" class="screen"></div>
  <div id="screen-battle" class="screen"></div>
  <!-- §32 the deathmatch lobby. ui/lobby.js self-creates this div if it is
       missing, the way ui/battle3d.js does, but it is declared here so the
       router finds it on the first show() rather than on the second. -->
  <div id="screen-lobby" class="screen"></div>
  <div id="dialog-layer" class="hidden" aria-live="polite"></div>
  <div id="overlay-menu" class="hidden"></div>
  <div id="toast-layer"></div>
  <div id="fx-grain" aria-hidden="true"></div>
</div>
<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script src="vendor/DRACOLoader.js"></script>
<script src="vendor/RGBELoader.js"></script>
<script src="js/data/config.js"></script>
<!-- §32 PvP tuning. Pure numbers, read lazily by everything, so its only real
     ordering rule is the one every data file has: after config.js. -->
<script src="js/data/pvp.js"></script>
<script src="js/data/version.js"></script>
<script src="js/data/elements.js"></script>
<script src="js/data/portraits.js"></script>
<script src="js/data/characters.js"></script>
<script src="js/data/moves.js"></script>
<script src="js/data/weapons.js"></script>
<script src="js/data/items.js"></script>
<script src="js/data/enemies.js"></script>
<script src="js/data/tree.js"></script>
<script src="js/data/room3d.js"></script>
<script src="js/data/arena3d.js"></script>
<script src="js/data/arena-nav.js"></script>
<!-- §24 stages: must load BEFORE any engine file, because arena3d.js reads
     CHLOE.data.stages at definition time to publish CHLOE.engine.stages. -->
<script src="js/data/stages.js"></script>
<script src="js/data/abilities.js"></script>
<script src="js/data/skilltree.js"></script>
<script src="js/data/knighttree.js"></script>
<!-- §28 B: the knight's rigid-plate bone hierarchy, GENERATED by
     tools/build-knight-rig.js. engine/knightanim.js reads it at build time;
     without this tag the knight loads and then stands there, because
     knightanim's own fallback is "no rig data, stay static". -->
<script src="js/data/knightrig.js"></script>
<script src="js/data/story.js"></script>
<script src="js/data/scenes.js"></script>
<script src="js/engine/progression.js"></script>
<script src="js/engine/tree.js"></script>
<script src="js/engine/skilltree.js"></script>
<script src="js/engine/knighttree.js"></script>
<script src="js/engine/displays.js"></script>
<script src="js/engine/party.js"></script>
<script src="js/engine/inventory.js"></script>
<!-- §27D/E. Engines, so they load after every data file (shop prices come from
     data/items.js, the record patch line from data/version.js) and before the
     UI and world3d that call them. A new module with no script tag is a whole
     feature shipped dead — §24 did exactly that — so these three tags are as
     load-bearing as the code they pull in. -->
<script src="js/engine/shop.js"></script>
<script src="js/engine/records.js"></script>
<!-- §32 the transport, and it belongs in this same group for the same reason:
     it reads the config gate, so it loads after every data file, and the lobby
     and the match layer both call it, so it loads before them. records.js is
     its nearest sibling in kind — the only other module here that talks to a
     server, and the one whose "the network is decoration" law it inherits. -->
<script src="js/engine/net.js"></script>
<script src="js/engine/battle.js"></script>
<script src="js/engine/arena.js"></script>
<script src="js/engine/combat3.js"></script>
<!-- Mirror fight AI: the clone's independent decision loop and ability
     mapping.  After combat3.js (reads knownAbilities at runtime) and before
     world3d.js (which publishes the onDoor hook it drives). -->
<script src="js/engine/cloneai.js"></script>
<!-- §32 the match layer: the roster, the seats, kill attribution and the
     level-on-kill rule. Exactly cloneai's slot, and for exactly cloneai's two
     reasons — it reads combat3's API at runtime, and world3d/battle3d call
     into it. It owns no DOM; every pixel of the lobby is in ui/lobby.js. -->
<script src="js/engine/pvp.js"></script>
<script src="js/engine/world3d.js"></script>
<!-- §28 C: the pose driver. Before arena3d.js, which calls into it at every
     phase boundary and at knight load. A module with no script tag is a whole
     feature shipped dead — §24 did exactly that — and this one would be silent
     about it: arena3d degrades to a static knight rather than throwing. -->
<script src="js/engine/knightanim.js"></script>
<!-- §29: the 9mm first-person prop. Before arena3d.js, which mounts it at init
     and ticks it every frame. Same warning as the two tags above — a module
     with no script tag is a whole feature shipped dead, and this one would be
     silent about it: arena3d degrades to no visible pistol rather than
     throwing, so the shot would keep working and nobody would see a gun. -->
<script src="js/engine/gunrig.js"></script>
<script src="js/engine/arena3d.js"></script>
<script src="js/ui/ui.js"></script>
<script src="js/ui/loading.js"></script>
<script src="js/ui/title.js"></script>
<script src="js/ui/dialog.js"></script>
<script src="js/ui/scene.js"></script>
<script src="js/ui/battleui.js"></script>
<script src="js/ui/battle3d.js"></script>
<script src="js/ui/binds.js"></script>
<script src="js/ui/loadout.js"></script>
<script src="js/ui/sheet.js"></script>
<script src="js/ui/room3d.js"></script>
<script src="js/ui/menu.js"></script>
<!-- the shop overlay: after ui/ui.js (it assigns onto CHLOE.ui and draws with
     ui.el) and after engine/shop.js, whose rules it renders. -->
<script src="js/ui/shop.js"></script>
<!-- §32 the lobby screen: after ui/ui.js (it assigns onto CHLOE.ui and draws
     with ui.el) and after engine/net.js and engine/pvp.js, whose transport and
     roster it renders. Same shape as the shop tag above it. -->
<script src="js/ui/lobby.js"></script>
<script src="js/main.js"></script>
</body>
</html>
